<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Full4Less logo">
  <defs>
    <radialGradient id="glow" cx="38%" cy="70%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate"><circle cx="256" cy="256" r="200"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1B242B"/>
