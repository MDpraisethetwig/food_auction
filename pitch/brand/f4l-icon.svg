      <rect x="146" y="118" width="210" height="210" rx="36" transform="rotate(-12 251 223)"/>
      <rect x="182" y="146" width="210" height="210" rx="36"/>
      <rect x="196" y="190" width="200" height="200" rx="36" transform="rotate(14 296 290)"/>
      <rect x="104" y="196" width="210" height="210" rx="36" transform="rotate(28 209 301)"/>
    </g>
  </g>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#fff" stroke-width="8"/>
  <!-- F4L -->
  <g fill="none" stroke="#72C14A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 334 V178 H176 M116 254 H164"/>
    <path d="M284 178 L204 288 H318 M284 178 V334"/>
